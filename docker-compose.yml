services:
  # Frontend React
  frontend:
    container_name: fitflow-frontend
    build:
      context: ./fitflow-frontend
      dockerfile: Dockerfile
    ports:
      - "3000:8080"
    volumes:
      - ./fitflow-frontend:/app
      - /app/node_modules
    environment:
      - NODE_ENV=development
      - VITE_API_URL=http://localhost:8000/api
    networks:
      - fitflow-network
    depends_on:
      - backend

  # Backend Laravel
  backend:
    container_name: fitflow-backend
    build:
      context: ./fitflow-backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ./fitflow-backend:/var/www/html
      - ./fitflow-backend/storage:/var/www/html/storage
    env_file:
      - ./fitflow-backend/.env
    networks:
      - fitflow-network
    depends_on:
      mysql:
        condition: service_healthy

  # MySQL Database
  mysql:
      container_name: fitflow-mysql
      image: mysql:8.0
      ports:
        - "3306:3306"
      environment:
        MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
        MYSQL_DATABASE: ${DB_DATABASE}
        MYSQL_USER: ${DB_USERNAME}
        MYSQL_PASSWORD: ${DB_PASSWORD}
      volumes:
        - mysql-data:/var/lib/mysql
      networks:
        - fitflow-network
      healthcheck:
        test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
        interval: 10s
        timeout: 5s
        retries: 5

  # Nginx Reverse Proxy
  nginx:
    container_name: fitflow-nginx
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - fitflow-network
    depends_on:
      - frontend
      - backend

networks:
  fitflow-network:
    driver: bridge

volumes:
  mysql-data: